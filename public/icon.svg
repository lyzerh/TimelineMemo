<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Main Schedule Slate -->
  <g filter="url(#shadow)">
    <rect x="76" y="80" width="360" height="352" rx="36" fill="url(#cardGrad)" />
  </g>

  <!-- Top Header bar on slate -->
  <rect x="76" y="80" width="360" height="84" rx="36" fill="#6366f1" />
  <rect x="76" y="128" width="360" height="36" fill="#6366f1" />

  <!-- Slate Header Elements -->
  <circle cx="124" cy="122" r="14" fill="#ffffff" opacity="0.9" />
  <rect x="156" y="114" width="130" height="16" rx="8" fill="#ffffff" opacity="0.95" />
  <rect x="340" y="114" width="56" height="16" rx="8" fill="#ffffff" opacity="0.5" />

  <!-- Timetable Grid & Tasks -->
  <!-- 09:00 Slot -->
  <text x="108" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#94a3b8">09:00</text>
  <rect x="176" y="184" width="224" height="42" rx="12" fill="#e0e7ff" />
  <rect x="180" y="188" width="6" height="34" rx="3" fill="#4f46e5" />
  <rect x="200" y="196" width="120" height="16" rx="4" fill="#4338ca" />

  <!-- 11:00 Slot -->
  <text x="108" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#94a3b8">11:00</text>
  <line x1="176" y1="266" x2="400" y2="266" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 4" />

  <!-- 14:00 Slot -->
  <text x="108" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#94a3b8">14:00</text>
  <rect x="176" y="324" width="224" height="64" rx="12" fill="#dcfce7" />
  <rect x="180" y="328" width="6" height="56" rx="3" fill="#16a34a" />
  <rect x="200" y="338" width="140" height="16" rx="4" fill="#15803d" />
  <rect x="200" y="362" width="90" height="12" rx="4" fill="#86efac" />

  <!-- Dynamic Red Timeline Indicator line at 10:15 -->
  <line x1="96" y1="240" x2="416" y2="240" stroke="#ef4444" stroke-width="3.5" />
  <circle cx="100" cy="240" r="6" fill="#ef4444" />
</svg>